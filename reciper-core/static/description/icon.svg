<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Recipes: a plate between a spoon and a knife -->
  <rect width="100" height="100" fill="#F28C28"/>
  <!-- plate -->
  <circle cx="50" cy="50" r="26" fill="#FFF"/>
  <circle cx="50" cy="50" r="18" fill="none" stroke="#F3D3B1" stroke-width="3"/>
  <!-- spoon (left) -->
  <ellipse cx="14" cy="30" rx="6" ry="9" fill="#FFF"/>
  <rect x="12.5" y="37" width="3" height="40" rx="1.5" fill="#FFF"/>
  <!-- knife (right) -->
  <path d="M84 20 C91 26 91 44 86 52 L84 52 Z" fill="#FFF"/>
  <rect x="82.5" y="50" width="3.5" height="28" rx="1.7" fill="#FFF"/>
</svg>
